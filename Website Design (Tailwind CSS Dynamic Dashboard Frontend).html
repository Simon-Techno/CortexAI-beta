<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex AI - Oncology Imaging Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <div class="max-w-5xl mx-auto px-6 py-12">
        <header class="mb-10 border-b border-slate-800 pb-6">
            <h1 class="text-3xl font-bold tracking-tight text-sky-400">Cortex AI Diagnostic Platform</h1>
            <p class="text-slate-400 mt-1">Multimodal CT/PET Scan Computer Vision & Risk Analysis Suite</p>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
                <h2 class="text-xl font-semibold mb-4 text-slate-200">Scan Ingestion Portal</h2>
                <div class="border-2 border-dashed border-slate-700 rounded-lg p-8 text-center bg-slate-950 hover:border-sky-500 transition cursor-pointer">
                    <input type="file" id="scanInput" class="hidden" accept=".dcm, .png, .jpg">
                    <label for="scanInput" class="cursor-pointer">
                        <span class="block text-sky-400 font-medium mb-1">Click to upload DICOM / Scan Slice</span>
                        <span class="text-xs text-slate-500">Supports .dcm, .png, .jpg up to 50MB</span>
                    </label>
                </div>
                <button onclick="handleUpload()" class="mt-6 w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-3 rounded-lg transition shadow-lg shadow-sky-900/30">
                    Run Neural Analysis
                </button>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-semibold mb-4 text-slate-200">Diagnostic Output Report</h2>
                    <div id="reportOutput" class="text-sm text-slate-400 space-y-3 bg-slate-950 p-4 rounded-lg border border-slate-800/60 min-h-[160px]">
                        Awaiting scan upload and model execution...
                    </div>
                </div>
                <div class="mt-6 pt-4 border-t border-slate-800 text-xs text-slate-500 flex justify-between">
                    <span>Engine: DenseNet121-Cortex</span>
                    <span class="text-emerald-400 font-medium">System Status: Operational</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        function handleUpload() {
            const output = document.getElementById('reportOutput');
            output.innerHTML = '<span class="text-sky-400 animate-pulse">Processing image data through deep learning networks & generating clinical report...</span>';
        }
    </script>
</body>
</html>
